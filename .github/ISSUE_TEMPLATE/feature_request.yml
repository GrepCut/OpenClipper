name: Feature request
description: Suggest an idea for Open Clipper
title: "[FEATURE] "
labels: enhancement
body:
  - type: markdown
    attributes:
      value: Please search existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternative
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: |
        Links, references, or mockups that give more context.

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
