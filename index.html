<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./clipper/clipper-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Clipper</title>
    <!-- Tło zgodne z backgroundColor okna Tauri — zapobiega jasnemu flashowi
         zanim załaduje się CSS aplikacji. -->
    <style>
      html,
      body,
      #root {
        background: #010409;
        margin: 0;
        height: 100%;
      }

      #open-clipper-boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(124, 58, 237, 0.16), transparent 34%),
          #010409;
        color: #f8fafc;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #open-clipper-boot-shell > div {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      #open-clipper-boot-shell img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <div id="open-clipper-boot-shell" role="status" aria-label="Open Clipper is starting">
      <div>
        <img src="./clipper/clipper-logo.png" alt="" />
        <span>Open Clipper</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
